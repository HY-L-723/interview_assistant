server:
  port: ${SERVER_PORT:8080}

app:
  upload:
    path: ${UPLOAD_PATH:uploads}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://localhost:5173}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

# JWT 配置
jwt:
  secret: ${JWT_SECRET:interview-assistant-secret-key-must-be-at-least-256-bits-long-for-hs256}
  expiration: ${JWT_EXPIRATION:86400000}          # token 有效期：24小时（毫秒）

# DeepSeek API 配置
llm:
  api-key: ${DEEPSEEK_API_KEY:}
  api-url: ${DEEPSEEK_API_URL:https://api.deepseek.com/chat/completions}
  model: ${DEEPSEEK_MODEL:deepseek-v4-pro}
  timeout: ${DEEPSEEK_TIMEOUT:60000}
  system-prompt: |
    你是一位专业的计算机专业面试辅导助手。你的任务是帮助计算机专业的学生准备技术面试，
    包括但不限于：数据结构与算法、操作系统、计算机网络、数据库、编程语言等核心课程的知识点讲解和模拟面试。
    请用中文回答，回答要专业、准确、易懂。

# 模拟面试配置
interview:
  default-question-count: ${INTERVIEW_DEFAULT_QUESTION_COUNT:5}          # 默认生成题目数量
  max-question-count: ${INTERVIEW_MAX_QUESTION_COUNT:10}                 # 最大题目数量限制

---
# 开发环境配置
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/interview_assistant?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update          # 开发时自动建表/更新表结构，生产环境改成 validate
    show-sql: true              # 控制台打印 SQL，调试用
    properties:
      hibernate:
        format_sql: true        # SQL 格式化输出
        dialect: org.hibernate.dialect.MySQLDialect

---
# 生产环境配置
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
